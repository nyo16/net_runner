name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.17.3"
  OTP_VERSION: "27.2"

jobs:
  compile:
    name: Compile & Warnings
    runs-on: ubuntu-latest
    env:
      WERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix hex.audit
      - run: mix deps.compile

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix credo --strict

  test:
    name: Tests (${{ matrix.os }} / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ${{ matrix.os }}
    env:
      WERROR: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.17.3"
            otp: "27.2"
          - os: ubuntu-latest
            elixir: "1.18.3"
            otp: "27.2"
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "28.3.3"
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0"
          - os: ubuntu-24.04-arm
            elixir: "1.20.2"
            otp: "29.0"
          - os: macos-latest
            elixir: "1.18.4"
            otp: "28.3.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps & build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      # Delegate a cgroup v2 subtree to the runner user so the positive-path
      # cgroup tests (test/cgroup_test.exs) exercise the privileged branch.
      # The shepherd hardcodes /sys/fs/cgroup/<path> and the Elixir side only
      # accepts paths under net_runner/, so no env var is needed — just a
      # writable net_runner/ subtree. Root cgroup.procs must also be writable
      # to migrate a process across the common ancestor (cgroup v2 delegation
      # containment rule).
      - name: Delegate cgroup v2 subtree for cgroup tests
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /sys/fs/cgroup/net_runner
          sudo chown -R "$(whoami)" /sys/fs/cgroup/net_runner
          sudo chown "$(whoami)" /sys/fs/cgroup/cgroup.procs
      - run: mix test

  test-alpine:
    name: Tests (Alpine / musl)
    runs-on: ubuntu-latest
    # Digest-pinned (alpine:3.22 at time of pinning); Dependabot does not scan
    # `container:` keys, so bump this digest manually when moving minors.
    container: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    env:
      WERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build toolchain and Erlang/Elixir
        run: apk add --no-cache build-base git erlang elixir

      - name: Install Hex & Rebar
        run: mix local.hex --force && mix local.rebar --force

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      - run: mix test

  deps-latest:
    # Simulates consumer dependency resolution: throw away the lockfile and
    # build against the newest versions Hex resolves. Non-blocking by design.
    name: Latest deps resolution (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - run: mix deps.unlock --all
      - run: mix deps.get
      - run: mix compile
      - run: mix test

  package:
    # Builds the Hex tarball and compiles it from scratch in a temp dir, the
    # way a consumer would — catches files missing from the package list.
    name: Package tarball compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - run: mix deps.get

      - name: Build tarball and compile it standalone
        env:
          MIX_ENV: prod
        run: |
          mix hex.build
          PKG_DIR="$(mktemp -d)"
          tar -xf net_runner-*.tar -C "$PKG_DIR"
          tar -xzf "$PKG_DIR/contents.tar.gz" -C "$PKG_DIR"
          cd "$PKG_DIR"
          mix deps.get
          mix compile

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Cache PLTs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      - run: mix dialyzer

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      WERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-asan-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix deps.compile

      - name: Build C with ASan + UBSan
        run: SANITIZE=1 make clean all

      - name: Resolve libasan for LD_PRELOAD
        run: echo "LIBASAN=$(gcc -print-file-name=libasan.so)" >> "$GITHUB_ENV"

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          LD_PRELOAD: ${{ env.LIBASAN }}
        run: mix test

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: [compile, format, credo, test, test-alpine, package, dialyzer, sanitizers]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: hex-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Verify tag matches @version and CHANGELOG
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MIX_VERSION="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          if [ "${TAG_VERSION}" != "${MIX_VERSION}" ]; then
            echo "::error::tag v${TAG_VERSION} does not match mix.exs @version ${MIX_VERSION}"
            exit 1
          fi
          if ! grep -q "^## \[${MIX_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${MIX_VERSION}]' heading"
            exit 1
          fi

      - run: mix deps.get
        env:
          MIX_ENV: dev
      - run: mix compile
        env:
          MIX_ENV: dev

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
