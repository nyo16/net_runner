name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.17.3"
  OTP_VERSION: "27.2"

# Every checkout sets persist-credentials: false, so GITHUB_TOKEN is not left
# in .git/config while dependency code runs. Do not export GITHUB_TOKEN into
# the environment of any job that compiles deps either: yamerl's
# rebar.config.script (via mix_audit) fetches a git plugin and passes the
# token to it when GITHUB_ACTIONS and GITHUB_TOKEN are both set.
#
# Cache keys carry a prefix per cached path set: mix-build (deps + _build),
# mix-deps (deps only), plt (plts/) and asan-build (sanitizer deps + _build).
# Jobs that share a key cache exactly the same paths.
#
# mix deps.get runs with --check-locked wherever mix.lock is authoritative.
# The two exceptions are deps-latest, which discards the lock on purpose, and
# the unpacked Hex tarball in package, which ships no mix.lock.

jobs:
  compile:
    name: Compile & Warnings
    runs-on: ubuntu-latest
    env:
      WERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Run this before any other build step. Later steps build into _build/,
      # and a stray write there would then go unnoticed.
      - name: Build into another PRIV_DIR, leaving the tree unchanged
        run: |
          make all PRIV_DIR="$RUNNER_TEMP/priv"
          test -z "$(git status --porcelain --ignored -- c_src priv _build)"

      - name: Cache deps & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-build-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-build-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get --check-locked
      - run: mix deps.unlock --check-unused
      - run: mix hex.audit
      - name: Scan deps for security advisories
        run: mix deps.audit
      - run: mix deps.compile

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-deps-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get --check-locked
      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-build-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-build-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get --check-locked
      - run: mix credo --strict

  test:
    name: Tests (${{ matrix.os }} / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}${{ matrix.cover && ' / cover' || '' }})
    runs-on: ${{ matrix.os }}
    env:
      WERROR: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            elixir: "1.17.3"
            otp: "27.2"
          - os: ubuntu-latest
            elixir: "1.18.3"
            otp: "27.2"
          - os: ubuntu-latest
            elixir: "1.19.7"
            otp: "28.3.3"
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "28.3.3"
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0"
          # Coverage leg: `mix test --cover` fails below the mix.exs
          # test_coverage threshold, and the HTML report is uploaded.
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0"
            cover: true
          - os: ubuntu-24.04-arm
            elixir: "1.20.2"
            otp: "29.0"
          - os: macos-latest
            elixir: "1.20.2"
            otp: "29.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-build-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile
      # Delegate a cgroup v2 subtree to the runner user so the positive-path
      # cgroup tests (test/cgroup_test.exs) exercise the privileged branch.
      # The shepherd hardcodes /sys/fs/cgroup/<path> and the Elixir side only
      # accepts paths under net_runner/, so just a writable net_runner/
      # subtree is needed (chowning the hosted runner's cgroup root does not
      # make it writable). The shepherd's on-demand ancestor creation
      # (issue #24) is still exercised: the nested-parent test creates a
      # fresh net_runner/parent_N/ on every run. Root cgroup.procs must also
      # be writable to migrate a process across the common ancestor (cgroup
      # v2 delegation containment rule). NR_CGROUP_DELEGATED=1 turns the
      # tests' degraded (fail-closed) branch into a hard failure on this leg,
      # so a delegation regression cannot pass as a green build with zero
      # cgroup coverage.
      - name: Delegate cgroup v2 subtree for cgroup tests
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /sys/fs/cgroup/net_runner
          sudo chown -R "$(whoami)" /sys/fs/cgroup/net_runner
          sudo chown "$(whoami)" /sys/fs/cgroup/cgroup.procs
          echo "NR_CGROUP_DELEGATED=1" >> "$GITHUB_ENV"
      # Hosted Ubuntu kernels have pidfd_open and pidfd_send_signal, so on
      # these legs the pidfd test's tolerant branch becomes a hard failure.
      # Left unset elsewhere (macOS has no pidfd).
      - name: Require pidfd support
        if: runner.os == 'Linux'
        run: echo "NR_PIDFD_REQUIRED=1" >> "$GITHUB_ENV"
      - run: mix test ${{ matrix.cover && '--cover' || '' }}

      - name: Upload coverage report
        if: ${{ matrix.cover && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: cover/
          if-no-files-found: error

  test-alpine:
    name: Tests (Alpine / musl)
    runs-on: ubuntu-latest
    # Digest-pinned (alpine:3.22 at time of pinning); Dependabot does not scan
    # `container:` keys, so bump this digest manually when moving minors.
    # No cgroup delegation here (the container has no writable cgroup v2
    # tree): the cgroup tests run their fail-closed branch and log
    # "[degraded]"; the Ubuntu leg above is the one that covers the positive
    # path.
    container: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    env:
      WERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain is pinned to an upstream version; `~` still accepts
      # Alpine's -rN security rebuilds of it. An unpinned `erlang` resolves to
      # erlang26 on 3.22, below the OTP 27 floor. Bump these together with the
      # container digest.
      - name: Install build toolchain and Erlang/Elixir
        run: apk add --no-cache build-base git "erlang27~27.3.4" "erlang27-dev~27.3.4" "elixir~1.18.3"

      - name: Install Hex & Rebar
        run: mix local.hex --force && mix local.rebar --force

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile
      - run: mix test

      - name: Link the shepherd as a static PIE
        run: |
          make all SHEPHERD_STATIC=1 PRIV_DIR=/tmp/static
          readelf -h /tmp/static/shepherd | grep -q 'DYN'
          if readelf -l /tmp/static/shepherd | grep -q INTERP; then exit 1; fi
          /tmp/static/shepherd 2>&1 | grep -q '^usage: shepherd'

  deps-latest:
    # Simulates consumer dependency resolution: throw away the lockfile and
    # build against the newest versions Hex resolves. Non-blocking by design.
    name: Latest deps resolution (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - run: mix deps.unlock --all
      - run: mix deps.get
      - run: mix compile
      - run: mix test

  package:
    # Builds the Hex tarball and compiles it from scratch in a temp dir, the
    # way a consumer would — catches files missing from the package list.
    name: Package tarball compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - run: mix deps.get --check-locked

      - name: Build tarball and compile it standalone
        env:
          MIX_ENV: prod
        run: |
          mix hex.build
          PKG_DIR="$(mktemp -d)"
          tar -xf net_runner-*.tar -C "$PKG_DIR"
          tar -xzf "$PKG_DIR/contents.tar.gz" -C "$PKG_DIR"
          cd "$PKG_DIR"
          mix deps.get
          mix compile
          mix run -e 'NetRunner.run(["true"]) == {"", 0} or System.halt(1)'

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-build-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-build-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      # plts/ is where mix.exs points dialyxir (plt_core_path/plt_local_path).
      - name: Cache PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: plts
          key: ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile
      - run: mix dialyzer

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      WERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-asan-build-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get --check-locked
      - run: mix deps.compile

      # Run by hand, make builds into _build/$MIX_ENV/lib/net_runner/priv
      # (MIX_ENV=test here), which is where `mix test` loads from; the later
      # elixir_make run finds the binaries up to date and keeps them.
      - name: Build C with ASan + UBSan
        run: SANITIZE=1 make clean all

      - name: Resolve libasan for LD_PRELOAD
        run: echo "LIBASAN=$(gcc -print-file-name=libasan.so)" >> "$GITHUB_ENV"

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          LD_PRELOAD: ${{ env.LIBASAN }}
        run: mix test

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: [compile, format, credo, test, test-alpine, package, dialyzer, sanitizers]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: hex-publish
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Verify tag matches @version and CHANGELOG
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          MIX_VERSION="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          if [ "${TAG_VERSION}" != "${MIX_VERSION}" ]; then
            echo "::error::tag v${TAG_VERSION} does not match mix.exs @version ${MIX_VERSION}"
            exit 1
          fi
          if ! grep -q "^## \[${MIX_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${MIX_VERSION}]' heading"
            exit 1
          fi

      # HEX_API_KEY is scoped to the two publish steps. Fetching, compiling
      # (which runs the Makefile) and the docs build all happen without it.
      # `mix hex.publish docs` re-invokes the docs task before uploading, so
      # ex_doc does run once more in that step, against the already-built
      # code and with the key present.
      - run: mix deps.get --check-locked
      - run: mix compile
      - name: Build docs
        run: mix docs

      - name: Publish package to Hex
        run: mix hex.publish package --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Publish docs to HexDocs
        run: mix hex.publish docs --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
